<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concredur — Informações do Equipamento</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', Arial, sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 12px 40px; color: #1a202c; }

    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.10); max-width: 600px; width: 100%; overflow: hidden; }

    /* HEADER */
    .v-header { background: #1a2e5a; color: #fff; padding: 0; }
    .v-header-top { display: flex; align-items: center; gap: 14px; padding: 20px 22px 16px; }
    .v-header-logo { flex-shrink: 0; }
    .v-header-info { flex: 1; }
    .v-header-info h1 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .65; margin-bottom: 3px; }
    .v-header-tag  { font-size: 22px; font-weight: 900; letter-spacing: 1.5px; font-family: Arial Black, sans-serif; line-height: 1; }
    .v-header-sub  { font-size: 12px; opacity: .7; margin-top: 3px; }

    /* STATUS BANNER */
    .status-banner { display: flex; align-items: center; gap: 10px; padding: 11px 22px; font-weight: 700; font-size: 13px; }
    .status-banner.valido   { background: #d1fae5; color: #065f46; border-bottom: 2px solid #6ee7b7; }
    .status-banner.invalido { background: #fee2e2; color: #991b1b; border-bottom: 2px solid #fca5a5; }
    .status-banner.loading  { background: #f1f5f9; color: #64748b; border-bottom: 2px solid #e2e8f0; }

    /* INFO GRID DO ATIVO */
    .ativo-info { padding: 18px 22px 0; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
    .info-item label { font-size: 10px; color: #718096; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 2px; }
    .info-item span  { font-size: 13px; font-weight: 600; color: #1a202c; }
    .info-item.full  { grid-column: span 2; }
    .crit-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 800; }
    .crit-alta  { background: #fee2e2; color: #991b1b; }
    .crit-media { background: #fef3c7; color: #92400e; }
    .crit-baixa { background: #d1fae5; color: #065f46; }

    /* ABAS */
    .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin: 18px 22px 0; gap: 0; }
    .tab-btn { flex: 1; padding: 10px 6px; font-size: 12px; font-weight: 700; color: #718096; background: none; border: none; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .15s; letter-spacing: .02em; }
    .tab-btn.active { color: #1a2e5a; border-bottom-color: #1a2e5a; }
    .tab-btn:hover:not(.active) { color: #1a2e5a; background: #f8fafc; }
    .tab-count { display: inline-block; background: #e2e8f0; color: #4a5568; font-size: 10px; font-weight: 800; border-radius: 20px; padding: 1px 7px; margin-left: 5px; }
    .tab-btn.active .tab-count { background: #1a2e5a; color: #fff; }

    /* CONTEÚDO DAS ABAS */
    .tab-content { display: none; padding: 16px 22px 20px; }
    .tab-content.active { display: block; }

    /* CARDS DE OS / PMOC */
    .registro-card { border: 1.5px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .registro-card:last-child { margin-bottom: 0; }
    .reg-header { background: #f8fafc; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e2e8f0; }
    .reg-codigo { font-size: 13px; font-weight: 800; color: #1a2e5a; }
    .reg-data   { font-size: 11px; color: #94a3b8; font-weight: 600; }
    .reg-body   { padding: 12px 14px; }
    .reg-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 10px; }
    .reg-field label { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 1px; }
    .reg-field span  { font-size: 12px; font-weight: 600; color: #1a202c; }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-pmoc { background: #dbeafe; color: #1e40af; }
    .badge-os   { background: #ede9fe; color: #5b21b6; }
    .badge-ok   { background: #d1fae5; color: #065f46; }
    .badge-aberta { background: #fef3c7; color: #92400e; }
    .badge-andamento { background: #dbeafe; color: #1e40af; }

    /* CHECKLIST COMPACTO */
    .chk-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chk-item { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .chk-c  { background: #d1fae5; color: #065f46; }
    .chk-nc { background: #fee2e2; color: #991b1b; }
    .chk-na { background: #f1f5f9; color: #94a3b8; }

    /* LAUDO / DEFEITO */
    .reg-texto { font-size: 12px; color: #374151; line-height: 1.6; background: #f8fafc; border-radius: 6px; padding: 8px 10px; margin-top: 8px; border-left: 3px solid #c7d5f0; }

    /* ASSINATURA */
    .assinatura-mini { margin-top: 10px; border-top: 1px solid #f1f5f9; padding-top: 10px; display: flex; align-items: center; gap: 10px; }
    .assinatura-mini img { max-height: 40px; max-width: 120px; border: 1px solid #e2e8f0; border-radius: 4px; }
    .assinatura-mini .nome { font-size: 11px; font-weight: 700; color: #1a2e5a; }
    .assinatura-mini .cargo { font-size: 10px; color: #94a3b8; }

    /* VAZIO */
    .vazio { text-align: center; padding: 30px 16px; color: #94a3b8; }
    .vazio-icon { font-size: 36px; margin-bottom: 10px; }
    .vazio p { font-size: 13px; font-weight: 600; }

    /* SPINNER */
    .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #1a2e5a; border-radius: 50%; animation: spin .8s linear infinite; margin: 30px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FOOTER */
    .v-footer { padding: 12px 22px; background: #f8fafc; border-top: 1px solid #e2e8f0; font-size: 10px; color: #94a3b8; text-align: center; }
    .v-footer a { color: #1a2e5a; font-weight: 700; text-decoration: none; }

    hr.div { border: none; border-top: 1px solid #f1f5f9; margin: 10px 0; }

    @media (max-width: 480px) {
      .info-grid, .reg-grid { grid-template-columns: 1fr; }
      .info-item.full { grid-column: span 1; }
    }
  </style>
</head>

<script>
  // Bancos Supabase: produção + homologação (fallback para QRs gerados em qualquer ambiente)
  const DB_PROD = supabase.createClient("https://mqijbvcnalbfjbhhjjzx.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xaWpidmNuYWxiZmpiaGhqanp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODM5ODcsImV4cCI6MjA5NjA1OTk4N30.2L_zzKs_voAt5SnmcKeYSBiskX46k8SFFdJgTkIGe7Q");
  const DB_HOMO = supabase.createClient("https://nweligwbglblbncaegir.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53ZWxpZ3diZ2xibGJuY2FlZ2lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMzAzNTgsImV4cCI6MjA5NTYwNjM1OH0.6eKcn40QmcfvHKAxuDH3kB6vHBJUu5LUVzfr27dvbKk");
  const db = DB_PROD; // padrão para PMOC/OS

  // Busca equipamento nos dois bancos
  async function buscarEquipamento(id) {
    // 1. Tenta por UUID no banco de produção
    const {data: e1} = await DB_PROD.from('equipamentos').select('*').eq('id', id).maybeSingle();
    if (e1) return e1;
    // 2. Tenta por UUID no banco de homologação
    const {data: e2} = await DB_HOMO.from('equipamentos').select('*').eq('id', id).maybeSingle();
    if (e2) return e2;
    // 3. Tenta por qrcode_token nos dois bancos
    const token = id.startsWith('EQ-') ? id : 'EQ-' + id;
    const {data: e3} = await DB_PROD.from('equipamentos').select('*').eq('qrcode_token', token).maybeSingle();
    if (e3) return e3;
    const {data: e4} = await DB_HOMO.from('equipamentos').select('*').eq('qrcode_token', token).maybeSingle();
    if (e4) return e4;
    // 4. Tenta token exato
    const {data: e5} = await DB_HOMO.from('equipamentos').select('*').eq('qrcode_token', id).maybeSingle();
    return e5 || null;
  }

  document.getElementById('data-verificacao').textContent = new Date().toLocaleString('pt-BR');

  const params = new URLSearchParams(window.location.search);
  const id   = params.get('id');
  const tipo = params.get('tipo');

  const fmtDate = d => d ? new Date(d.includes('T') ? d : d + 'T00:00:00').toLocaleDateString('pt-BR') : '—';
  const fmtDateTime = d => d ? new Date(d).toLocaleString('pt-BR') : '—';

  function setStatus(tipo, txt) {
    const el = document.getElementById('status-banner');
    el.className = 'status-banner ' + tipo;
    document.getElementById('status-texto').textContent = txt;
  }

  function mostrarErro(msg) {
    setStatus('invalido', '⚠️ ' + msg);
    document.getElementById('corpo-principal').innerHTML =
      `<div class="vazio"><div class="vazio-icon">❌</div><p>${msg}</p></div>`;
  }

  // ─────────────────────────────────────────────
  //  MODO EQUIPAMENTO — página principal do QR
  // ─────────────────────────────────────────────
  async function carregarEquipamento() {
    // Busca equipamento
    // Tenta por UUID primeiro; se falhar, tenta por qrcode_token (ex: "EQ-<uuid>")
    const eq = await buscarEquipamento(id);
    if (!eq) { mostrarErro('Equipamento não encontrado na base de dados.'); return; }

    // Busca OS e PMOC em paralelo
    const [{ data: listaOS }, { data: listaPMOC }] = await Promise.all([
      db.from('ordens_servico')
        .select('*, colaboradores(nome, assinatura_digital)')
        .eq('equipamento_id', id)
        .order('created_at', { ascending: false }),
      db.from('fichas_pmoc')
        .select('*, colaboradores:tecnico_nome')
        .eq('equipamento_id', id)
        .order('created_at', { ascending: false }),
    ]);

    const os   = listaOS   || [];
    const pmoc = listaPMOC || [];

    // Preenche header
    document.getElementById('header-tag').textContent = eq.tag;
    document.getElementById('header-sub').textContent =
      [eq.produto, eq.marca].filter(Boolean).join(' · ') || 'Ativo cadastrado';
    setStatus('valido', '✅ Ativo localizado e autenticado — ' + eq.tag);

    const critCls = eq.criticidade === 'Alta' ? 'crit-alta' : eq.criticidade === 'Baixa' ? 'crit-baixa' : 'crit-media';
    const catLabel = { AC:'❄️ Ar Condicionado', BEB:'💧 Bebedouro', CLIM:'🌀 Climatizador', VEN:'💨 Ventilador/Exaustor', OUT:'🔧 Outros' };

    const corpo = document.getElementById('corpo-principal');
    corpo.innerHTML = `
      <!-- DADOS DO ATIVO -->
      <div class="ativo-info">
        <div class="info-grid">
          <div class="info-item"><label>Categoria</label><span>${catLabel[eq.categoria] || '—'}</span></div>
          <div class="info-item"><label>Criticidade</label><span class="crit-badge ${critCls}">Classe ${eq.criticidade || 'Média'}</span></div>
          <div class="info-item"><label>Marca / Fabricante</label><span>${eq.marca || '—'}</span></div>
          <div class="info-item"><label>Modelo / Produto</label><span>${eq.produto || '—'}</span></div>
          <div class="info-item"><label>Nº de Série</label><span>${eq.nr_serie || '—'}</span></div>
          <div class="info-item"><label>Patrimônio</label><span>${eq.patrimonio || '—'}</span></div>
          <div class="info-item full"><label>Localização</label><span>${[eq.bloco, eq.setor, eq.sala, eq.instituicao].filter(Boolean).join(' › ') || '—'}</span></div>
        </div>
      </div>

      <!-- ABAS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="trocarAba('pmoc')">
          📋 Laudos PMOC <span class="tab-count" id="cnt-pmoc">${pmoc.length}</span>
        </button>
        <button class="tab-btn" onclick="trocarAba('os')">
          🛠️ Ordens de Serviço <span class="tab-count" id="cnt-os">${os.length}</span>
        </button>
      </div>

      <!-- ABA PMOC -->
      <div class="tab-content active" id="tab-pmoc">
        ${pmoc.length === 0
          ? `<div class="vazio"><div class="vazio-icon">📋</div><p>Nenhum laudo PMOC registrado para este ativo.</p></div>`
          : pmoc.map(f => renderCardPMOC(f)).join('')}
      </div>

      <!-- ABA OS -->
      <div class="tab-content" id="tab-os">
        ${os.length === 0
          ? `<div class="vazio"><div class="vazio-icon">🛠️</div><p>Nenhuma Ordem de Serviço registrada para este ativo.</p></div>`
          : os.map(o => renderCardOS(o)).join('')}
      </div>
    `;
  }

  // ─── CARD PMOC ───
  function renderCardPMOC(f) {
    const codigo   = 'L-PMOC-' + f.id.toString().slice(0,6).toUpperCase();
    const matchData  = (f.observacoes||'').match(/\[DataInspecao:\s*([^\]]+)\]/);
    const matchFreq  = (f.observacoes||'').match(/\[Frequencia:\s*([^\]]+)\]/);
    const matchChk   = (f.observacoes||'').match(/\[Checklist:\s*([^\]]+)\]/);
    const matchFiscal= (f.observacoes||'').match(/\[FiscalNome:\s*([^\]]+)\]/);
    const obsLimpa   = (f.observacoes||'').replace(/\[[^\]]+\]/g,'').trim();
    const dataInsp   = matchData ? matchData[1] : fmtDate(f.created_at);
    const freq       = matchFreq ? matchFreq[1] : '—';
    const fiscal     = matchFiscal ? matchFiscal[1].trim() : '—';
    const checklist  = matchChk ? (() => { try { return JSON.parse(matchChk[1]); } catch(e){ return {}; } })() : {};

    const labelChk = {
      'limpeza-filtro':'Filtro','limpeza-evaporadora':'Evaporadora','limpeza-condensadora':'Condensadora',
      'verificacao-dreno':'Dreno','verificacao-eletrica':'Elétrica','verificacao-fluido':'Fluido',
      'teste-operacao':'Operação','verificacao-ruidos':'Ruídos','limpeza-geral':'Limpeza Geral',
    };
    const chkHtml = Object.entries(checklist).length
      ? `<hr class="div"><div style="font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;">Checklist</div>
         <div class="chk-grid">${Object.entries(checklist).map(([k,v]) =>
           `<span class="chk-item chk-${v.toLowerCase()}">${labelChk[k]||k}: ${v}</span>`
         ).join('')}</div>` : '';

    const assinaturaHTML = f.assinatura_digital?.startsWith('data:image')
      ? `<div class="assinatura-mini"><img src="${f.assinatura_digital}" alt="Assinatura"><div><div class="nome">${f.tecnico_nome||'—'}</div><div class="cargo">Técnico Executor</div></div></div>`
      : `<div class="assinatura-mini"><div style="width:100px;height:36px;border-bottom:1px dashed #cbd5e0;"></div><div><div class="nome">${f.tecnico_nome||'—'}</div><div class="cargo">Técnico Executor</div></div></div>`;

    return `
      <div class="registro-card">
        <div class="reg-header">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="badge badge-pmoc">📋 PMOC</span>
            <span class="reg-codigo">${codigo}</span>
          </div>
          <span class="reg-data">${fmtDateTime(f.created_at)}</span>
        </div>
        <div class="reg-body">
          <div class="reg-grid">
            <div class="reg-field"><label>Data da Inspeção</label><span>${dataInsp}</span></div>
            <div class="reg-field"><label>Frequência</label><span>${freq}</span></div>
            <div class="reg-field"><label>Técnico Executor</label><span>${f.tecnico_nome||'—'}</span></div>
            <div class="reg-field"><label>Fiscal / Validador</label><span>${fiscal}</span></div>
          </div>
          ${obsLimpa ? `<div class="reg-texto">${obsLimpa}</div>` : ''}
          ${chkHtml}
          ${assinaturaHTML}
        </div>
      </div>`;
  }

  // ─── CARD OS ───
  function renderCardOS(o) {
    const codigo = 'OS-AC-' + o.id.toString().slice(0,5).toUpperCase();
    const col    = o.colaboradores || {};
    const stCls  = o.status_os === 'Concluída' ? 'badge-ok' : o.status_os === 'Em Andamento' ? 'badge-andamento' : 'badge-aberta';

    const assinaturaHTML = col.assinatura_digital?.startsWith('data:image')
      ? `<div class="assinatura-mini"><img src="${col.assinatura_digital}" alt="Assinatura"><div><div class="nome">${col.nome||'—'}</div><div class="cargo">Técnico Responsável</div></div></div>`
      : `<div class="assinatura-mini"><div style="width:100px;height:36px;border-bottom:1px dashed #cbd5e0;"></div><div><div class="nome">${col.nome||'—'}</div><div class="cargo">Técnico Responsável</div></div></div>`;

    return `
      <div class="registro-card">
        <div class="reg-header">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="badge badge-os">🛠️ O.S.</span>
            <span class="reg-codigo">${codigo}</span>
          </div>
          <span class="reg-data">${fmtDateTime(o.created_at)}</span>
        </div>
        <div class="reg-body">
          <div class="reg-grid">
            <div class="reg-field"><label>Tipo de Manutenção</label><span>${o.tipo_os||'—'}</span></div>
            <div class="reg-field"><label>Status</label><span class="badge ${stCls}">${o.status_os||'—'}</span></div>
            <div class="reg-field"><label>Técnico Responsável</label><span>${col.nome||'—'}</span></div>
            <div class="reg-field"><label>Data de Abertura</label><span>${fmtDate(o.created_at)}</span></div>
          </div>
          ${o.descricao_defeito ? `<div style="font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 3px;">Ocorrência</div><div class="reg-texto">${o.descricao_defeito}</div>` : ''}
          ${o.laudo_tecnico    ? `<div style="font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 3px;">Diagnóstico / Ações</div><div class="reg-texto">${o.laudo_tecnico}</div>` : ''}
          ${assinaturaHTML}
        </div>
      </div>`;
  }

  // ─── TROCA DE ABA ───
  function trocarAba(aba) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + aba).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // ─── MODO PMOC / OS (links diretos de documentos) ───
  async function verificarDocumento() {
    // redireciona para modo legado inline...
    const { data: f, error } = tipo === 'pmoc'
      ? await db.from('fichas_pmoc').select('*, equipamentos(tag,produto,marca,bloco,setor,sala)').eq('id', id).single()
      : await db.from('ordens_servico').select('*, equipamentos(tag,produto,bloco,setor,nr_serie), colaboradores(nome,assinatura_digital)').eq('id', id).single();

    if (error || !f) { mostrarErro('Documento não encontrado na base de dados.'); return; }

    if (tipo === 'pmoc') {
      const eq = f.equipamentos || {};
      const matchData  = (f.observacoes||'').match(/\[DataInspecao:\s*([^\]]+)\]/);
      const matchFreq  = (f.observacoes||'').match(/\[Frequencia:\s*([^\]]+)\]/);
      const matchFiscal= (f.observacoes||'').match(/\[FiscalNome:\s*([^\]]+)\]/);
      const codigo = 'L-PMOC-' + f.id.toString().slice(0,6).toUpperCase();
      document.getElementById('header-tag').textContent = eq.tag || codigo;
      document.getElementById('header-sub').textContent = 'Laudo PMOC — ' + (eq.produto||'Equipamento');
      setStatus('valido', '✅ Documento autêntico — ' + codigo);
      document.getElementById('corpo-principal').innerHTML = renderCardPMOC(f);
    } else {
      const eq = f.equipamentos || {};
      const codigo = 'OS-AC-' + f.id.toString().slice(0,5).toUpperCase();
      document.getElementById('header-tag').textContent = eq.tag || codigo;
      document.getElementById('header-sub').textContent = 'Ordem de Serviço — ' + (eq.produto||'Equipamento');
      setStatus('valido', '✅ Documento autêntico — ' + codigo);
      document.getElementById('corpo-principal').innerHTML = renderCardOS(f);
    }
  }

  // ─── ROTEAMENTO ───
  async function init() {
    if (!id) { mostrarErro('ID não informado na URL.'); return; }
    if (tipo === 'equipamento') {
      await carregarEquipamento();
    } else if (tipo === 'pmoc' || tipo === 'os') {
      await verificarDocumento();
    } else {
      mostrarErro('Tipo de documento desconhecido: ' + (tipo||'não informado'));
    }
  }

  init();
</script>
</body>
</html>
